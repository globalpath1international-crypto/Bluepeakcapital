<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Transaction History — Bluepeak Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy-900: #0A1A2F;
      --navy-800: #10243E;
      --navy-700: #1A3352;
      --navy-100: #E8EDF4;
      --navy-50:  #F2F5FA;
      --gold-500: #C9A84C;
      --gold-400: #DDBE6B;
      --gold-100: #FBF5E6;
      --green-500: #0F9D6E;
      --green-100: #E6F7F1;
      --red-500: #D14343;
      --red-100: #FDECEC;
      --blue-500: #2563EB;
      --blue-100: #DBEAFE;
      --white: #FFFFFF;
      --gray-100: #F1F4F9;
      --gray-200: #E3E8EF;
      --gray-300: #CDD5E0;
      --gray-400: #94A3B8;
      --gray-500: #64748B;
      --gray-600: #475569;
      --bg-main: #FAFBFD;
      --shadow-xs: 0 1px 2px rgba(10, 26, 47, 0.04);
      --shadow-sm: 0 2px 8px rgba(10, 26, 47, 0.05);
      --shadow-md: 0 8px 24px rgba(10, 26, 47, 0.07);
      --shadow-lg: 0 16px 48px rgba(10, 26, 47, 0.10);
      --shadow-gold: 0 4px 16px rgba(201, 168, 76, 0.25);
      --radius-xs: 8px;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --radius-pill: 999px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html { height: 100%; scroll-behavior: smooth; }
    body {
      font-family: var(--font); background-color: var(--bg-main);
      color: var(--navy-900); line-height: 1.45;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      padding-bottom: 92px; min-height: 100vh; display: flex;
      flex-direction: column; overflow-x: hidden;
    }

    /* HEADER */
    .history-header {
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px);
      padding: 10px 16px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid var(--gray-200);
      position: sticky; top: 0; z-index: 30; gap: 8px;
    }
    .history-header-left { display: flex; align-items: center; gap: 8px; flex-shrink: 1; min-width: 0; }
    .icon-btn {
      background: none; border: none; padding: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-xs); color: var(--navy-900);
      transition: background 0.2s; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--navy-50); }
    .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .header-title { font-size: 17px; font-weight: 800; color: var(--navy-900); letter-spacing: -0.3px; }
    .export-btn {
      background: var(--navy-50); border: 1px solid var(--gray-200);
      padding: 7px 12px; border-radius: var(--radius-pill);
      font-family: var(--font); font-size: 11.5px; font-weight: 700;
      color: var(--navy-900); cursor: pointer; display: flex; align-items: center; gap: 5px;
      transition: all 0.15s;
    }
    .export-btn:hover { background: var(--gold-100); border-color: var(--gold-500); }
    .export-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* MAIN */
    .history-main {
      flex: 1; padding: 16px 16px 0; max-width: 600px;
      margin: 0 auto; width: 100%;
      display: flex; flex-direction: column; gap: 14px;
    }

    /* STATS */
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .stat-card {
      background: var(--white); border: 1px solid var(--gray-200);
      border-radius: var(--radius-md); padding: 14px 16px;
      box-shadow: var(--shadow-xs);
      display: flex; flex-direction: column; gap: 4px;
    }
    .stat-label {
      font-size: 10.5px; font-weight: 700; color: var(--gray-500);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 18px; font-weight: 800; color: var(--navy-900);
      font-variant-numeric: tabular-nums; letter-spacing: -0.4px;
    }
    .stat-value.positive { color: var(--green-500); }
    .stat-value.negative { color: var(--red-500); }

    /* SEARCH */
    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; stroke: var(--gray-500); fill: none;
      stroke-width: 2; pointer-events: none;
    }
    .search-input {
      width: 100%; padding: 12px 16px 12px 42px;
      background: var(--white); border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-pill); font-family: var(--font);
      font-size: 13.5px; font-weight: 500; color: var(--navy-900);
      outline: none; transition: border 0.2s;
    }
    .search-input:focus { border-color: var(--gold-500); }
    .search-input::placeholder { color: var(--gray-400); font-weight: 500; }

    /* FILTER TABS */
    .filter-tabs {
      display: flex; gap: 6px; overflow-x: auto;
      scrollbar-width: none; padding-bottom: 4px;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab {
      padding: 8px 16px; border-radius: var(--radius-pill);
      background: var(--white); border: 1px solid var(--gray-200);
      font-family: var(--font); font-size: 12.5px; font-weight: 700;
      color: var(--gray-500); cursor: pointer; transition: all 0.2s;
      flex-shrink: 0; white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
    }
    .filter-tab:hover { border-color: var(--gold-500); color: var(--navy-900); }
    .filter-tab.active { background: var(--navy-900); border-color: var(--navy-900); color: var(--white); }
    .filter-tab .count {
      background: var(--gray-200); color: var(--navy-900);
      font-size: 10px; font-weight: 800; padding: 1px 6px;
      border-radius: var(--radius-pill); min-width: 18px; text-align: center;
    }
    .filter-tab.active .count {
      background: var(--gold-500); color: var(--white);
    }

    /* TRANSACTION LIST */
    .tx-list {
      display: flex; flex-direction: column; gap: 14px;
    }
    .tx-group {
      display: flex; flex-direction: column; gap: 6px;
    }
    .tx-group-label {
      font-size: 11px; font-weight: 800; color: var(--gray-500);
      text-transform: uppercase; letter-spacing: 0.7px;
      padding: 6px 4px 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .tx-group-label::after {
      content: ''; flex: 1; height: 1px; background: var(--gray-200);
    }

    .tx-item {
      background: var(--white); border: 1px solid var(--gray-200);
      border-radius: var(--radius-md); padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      cursor: pointer; transition: all 0.15s;
    }
    .tx-item:hover { border-color: var(--gold-500); box-shadow: var(--shadow-sm); }
    .tx-item:active { transform: scale(0.995); }

    .tx-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .tx-icon.deposit { background: var(--green-100); color: var(--green-500); }
    .tx-icon.withdraw { background: var(--red-100); color: var(--red-500); }
    .tx-icon.swap { background: var(--gold-100); color: var(--gold-500); }
    .tx-icon.trade { background: var(--blue-100); color: var(--blue-500); }
    .tx-icon.p2p { background: #EDE9FE; color: #7C3AED; }
    .tx-icon.bot { background: var(--navy-50); color: var(--navy-700); }

    .tx-content { flex: 1; min-width: 0; }
    .tx-title-row {
      display: flex; align-items: center; gap: 6px;
    }
    .tx-title {
      font-size: 13.5px; font-weight: 800; color: var(--navy-900);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tx-badge {
      font-size: 9px; font-weight: 800; padding: 2px 6px;
      border-radius: var(--radius-pill); text-transform: uppercase;
      letter-spacing: 0.3px; flex-shrink: 0;
    }
    .tx-badge.completed { background: var(--green-100); color: var(--green-500); }
    .tx-badge.pending { background: var(--gold-100); color: var(--gold-500); }
    .tx-badge.failed { background: var(--red-100); color: var(--red-500); }
    .tx-meta {
      font-size: 11.5px; font-weight: 500; color: var(--gray-500);
      margin-top: 2px; display: flex; align-items: center; gap: 6px;
    }
    .tx-meta .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--gray-300); }

    .tx-amount-col { text-align: right; flex-shrink: 0; }
    .tx-amount {
      font-size: 14px; font-weight: 800;
      font-variant-numeric: tabular-nums; letter-spacing: -0.2px;
    }
    .tx-amount.positive { color: var(--green-500); }
    .tx-amount.negative { color: var(--red-500); }
    .tx-amount-usd {
      font-size: 11px; font-weight: 600; color: var(--gray-500);
      margin-top: 2px; font-variant-numeric: tabular-nums;
    }

    /* EMPTY */
    .empty-state {
      text-align: center; padding: 60px 24px;
      background: var(--white); border: 1px dashed var(--gray-300);
      border-radius: var(--radius-lg);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 15px; font-weight: 800; color: var(--navy-900); margin-bottom: 4px; }
    .empty-state p { font-size: 13px; font-weight: 500; color: var(--gray-500); line-height: 1.5; max-width: 280px; margin: 0 auto; }

    /* DETAIL MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(10, 26, 47, 0.6);
      backdrop-filter: blur(4px); z-index: 70;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .bottom-sheet {
      position: fixed; bottom: 0; left: 0; width: 100%; max-height: 90vh;
      background: var(--white); z-index: 75;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .bottom-sheet.open { transform: translateY(0); }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px; border-bottom: 1px solid var(--gray-200); flex-shrink: 0;
    }
    .sheet-header h3 { font-size: 17px; font-weight: 800; color: var(--navy-900); }
    .sheet-close {
      background: var(--navy-50); border: none; width: 34px; height: 34px;
      border-radius: 50%; font-size: 16px; cursor: pointer; color: var(--navy-900);
      display: flex; align-items: center; justify-content: center;
    }
    .sheet-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    .detail-hero {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 8px 0 16px;
      border-bottom: 1px solid var(--gray-100);
    }
    .detail-icon {
      width: 56px; height: 56px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; margin-bottom: 10px;
    }
    .detail-icon.deposit { background: var(--green-100); color: var(--green-500); }
    .detail-icon.withdraw { background: var(--red-100); color: var(--red-500); }
    .detail-icon.swap { background: var(--gold-100); color: var(--gold-500); }
    .detail-icon.trade { background: var(--blue-100); color: var(--blue-500); }
    .detail-icon.p2p { background: #EDE9FE; color: #7C3AED; }
    .detail-icon.bot { background: var(--navy-50); color: var(--navy-700); }

    .detail-amount {
      font-size: 24px; font-weight: 800; letter-spacing: -0.6px;
      font-variant-numeric: tabular-nums;
    }
    .detail-amount.positive { color: var(--green-500); }
    .detail-amount.negative { color: var(--red-500); }
    .detail-usd {
      font-size: 13px; font-weight: 600; color: var(--gray-500);
      margin-top: 4px; font-variant-numeric: tabular-nums;
    }
    .detail-status-badge {
      margin-top: 10px; padding: 4px 12px; border-radius: var(--radius-pill);
      font-size: 10.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .detail-status-badge.completed { background: var(--green-100); color: var(--green-500); }
    .detail-status-badge.pending { background: var(--gold-100); color: var(--gold-500); }
    .detail-status-badge.failed { background: var(--red-100); color: var(--red-500); }

    .detail-rows {
      display: flex; flex-direction: column; gap: 2px;
    }
    .detail-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 10px 0; border-bottom: 1px solid var(--gray-100);
      font-size: 12.5px; gap: 12px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .dr-label {
      font-weight: 600; color: var(--gray-500); flex-shrink: 0;
    }
    .detail-row .dr-value {
      font-weight: 800; color: var(--navy-900); text-align: right;
      font-variant-numeric: tabular-nums; word-break: break-all;
      max-width: 60%;
    }
    .detail-row .dr-value code {
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 11.5px; color: var(--navy-800);
    }
    .detail-row .dr-value .copy-mini {
      background: var(--navy-50); border: none; padding: 2px 6px;
      border-radius: 4px; font-size: 10px; font-weight: 700;
      color: var(--navy-700); cursor: pointer; margin-left: 4px;
    }

    .detail-actions {
      display: flex; flex-direction: column; gap: 8px; margin-top: 8px;
    }
    .btn-detail {
      padding: 13px; border-radius: var(--radius-pill);
      background: var(--navy-50); border: 1.5px solid var(--gray-200);
      color: var(--navy-900); font-family: var(--font);
      font-weight: 800; font-size: 13.5px; cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-detail:hover { background: var(--gold-100); border-color: var(--gold-500); }
    .btn-detail.primary {
      background: linear-gradient(135deg, var(--green-500), #0B8A5E);
      border: none; color: var(--white);
      box-shadow: 0 4px 14px rgba(15, 157, 110, 0.3);
    }
    .btn-detail.primary:hover { transform: translateY(-1px); }

    /* TOAST */
    .toast {
      position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--navy-900); color: var(--white);
      padding: 12px 20px; border-radius: var(--radius-pill);
      font-size: 13px; font-weight: 700; z-index: 200;
      opacity: 0; pointer-events: none; transition: all 0.3s;
      max-width: calc(100% - 40px); text-align: center;
      box-shadow: 0 8px 24px rgba(10, 26, 47, 0.3);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 700px; background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(16px); border-top: 1px solid var(--gray-200);
      display: flex; justify-content: space-around; align-items: center;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 40; box-shadow: 0 -4px 20px rgba(10, 26, 47, 0.06);
    }
    .bottom-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; cursor: pointer;
      padding: 6px 8px; border-radius: var(--radius-sm);
      transition: all 0.2s; flex: 1; max-width: 80px;
      color: var(--gray-500); font-family: var(--font);
      font-size: 10px; font-weight: 600; letter-spacing: 0.2px;
    }
    .bottom-nav-item.active { color: var(--navy-900); font-weight: 800; }
    .bottom-nav-item.active .bn-icon-wrap { background: var(--navy-900); }
    .bottom-nav-item.active .bn-icon-wrap svg { stroke: var(--gold-400); }
    .bn-icon-wrap {
      width: 38px; height: 26px; border-radius: var(--radius-xs);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .bottom-nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

    @media (max-width: 400px) {
      .stats-grid { grid-template-columns: 1fr; }
    }
    @media (min-width: 700px) {
      body { padding-bottom: 100px; }
      .history-main { max-width: 640px; padding: 20px 24px 0; }
      .bottom-nav { max-width: 900px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    }
  </style>
</head>
<body>

  <div class="modal-overlay" id="detailOverlay"></div>
  <div class="bottom-sheet" id="detailModal">
    <div class="sheet-header">
      <h3>Transaction Details</h3>
      <button class="sheet-close" id="detailClose">✕</button>
    </div>
    <div class="sheet-body" id="detailBody"></div>
  </div>

  <header class="history-header">
    <div class="history-header-left">
      <button class="icon-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="header-title">Transaction History</span>
    </div>
    <button class="export-btn" id="exportBtn">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Export
    </button>
  </header>

  <main class="history-main">

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total In</div>
        <div class="stat-value positive" id="totalIn">$0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Out</div>
        <div class="stat-value negative" id="totalOut">$0.00</div>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search by asset, address, or ID…" autocomplete="off">
    </div>

    <!-- FILTER TABS -->
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">All <span class="count" id="cnt-all">0</span></button>
      <button class="filter-tab" data-filter="deposit">Deposits</button>
      <button class="filter-tab" data-filter="withdraw">Withdrawals</button>
      <button class="filter-tab" data-filter="swap">Swaps</button>
      <button class="filter-tab" data-filter="trade">Trades</button>
      <button class="filter-tab" data-filter="p2p">P2P</button>
    </div>

    <!-- LIST -->
    <div class="tx-list" id="txList"></div>

  </main>

  <nav class="bottom-nav">
    <button class="bottom-nav-item" data-nav="home">
      <div class="bn-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></div>
      <span>Home</span>
    </button>
    <button class="bottom-nav-item" data-nav="p2p">
      <div class="bn-icon-wrap"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.8-3.5 3.2-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="8" r="2.8"/><path d="M15.5 14c2.5 0 4.8 1.5 5.5 4.5"/></svg></div>
      <span>P2P</span>
    </button>
    <button class="bottom-nav-item" data-nav="trade">
      <div class="bn-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 20L9 14l4 4 8-8"/><path d="M17 10h4v4"/></svg></div>
      <span>Trade</span>
    </button>
    <button class="bottom-nav-item" data-nav="swap">
      <div class="bn-icon-wrap"><svg viewBox="0 0 24 24"><path d="M7 4v13M7 17l-3-3M7 17l3-3"/><path d="M17 20V7M17 7l3 3M17 7l-3 3"/></svg></div>
      <span>Swap</span>
    </button>
    <button class="bottom-nav-item active" data-nav="wallet">
      <div class="bn-icon-wrap"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M16 13h.01"/><path d="M2 9h20"/></svg></div>
      <span>Wallet</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    (function() {
      'use strict';

      const $ = (s) => document.querySelector(s);
      const $$ = (s) => document.querySelectorAll(s);
      const toastEl = $('#toast');

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2600);
      }

      // ============================================================
      // LOAD TRANSACTIONS from localStorage (real user data)
      // ============================================================
      function loadTransactions() {
        const txs = [];

        // Withdrawals
        const withdrawals = JSON.parse(localStorage.getItem('bp_withdrawals') || '[]');
        withdrawals.forEach((w, i) => {
          txs.push({
            id: 'w-' + i,
            type: 'withdraw',
            title: 'Withdraw ' + w.asset,
            asset: w.asset,
            amount: w.amount,
            amountUSD: 0, // simplified
            network: w.network,
            status: w.status || 'pending',
            date: w.time,
            address: w.address,
            fee: w.fee,
          });
        });

        // Recent swaps
        const swaps = JSON.parse(localStorage.getItem('bp_recent_swaps') || '[]');
        swaps.forEach((s, i) => {
          txs.push({
            id: 's-' + i,
            type: 'swap',
            title: s.from + ' → ' + s.to,
            asset: s.to.split(' ')[1] || '',
            amount: s.to,
            amountUSD: 0,
            network: '—',
            status: 'completed',
            date: s.date + ' ' + s.time,
            rate: s.rate,
          });
        });

        // Deposits (from history)
        const deposits = JSON.parse(localStorage.getItem('bp_deposits') || '[]');
        deposits.forEach((d, i) => {
          txs.push({
            id: 'd-' + i,
            type: 'deposit',
            title: 'Deposit ' + d.asset,
            asset: d.asset,
            amount: d.amount,
            amountUSD: d.amountUSD || 0,
            network: d.network,
            status: d.status || 'completed',
            date: d.time,
            address: d.address,
          });
        });

        // P2P orders
        const p2pOrders = JSON.parse(localStorage.getItem('bp_p2p_orders') || '[]');
        p2pOrders.forEach((o, i) => {
          txs.push({
            id: 'p-' + i,
            type: 'p2p',
            title: (o.side === 'buy' ? 'Buy' : 'Sell') + ' ' + o.asset,
            asset: o.asset,
            amount: o.amount,
            amountUSD: o.amountUSD || 0,
            network: o.network || '—',
            status: o.status || 'completed',
            date: o.time,
            counterparty: o.counterparty,
          });
        });

        // Demo transactions if empty
        if (txs.length === 0) {
          txs.push(
            { id: 'demo1', type: 'deposit', title: 'Deposit USDT', asset: 'USDT', amount: '500.00', amountUSD: 500, network: 'TRC20', status: 'completed', date: new Date(Date.now() - 3600000).toISOString(), address: 'TXk7bF9m...' },
            { id: 'demo2', type: 'swap', title: 'USDT → BTC', asset: 'BTC', amount: '0.0061', amountUSD: 500, network: '—', status: 'completed', date: new Date(Date.now() - 7200000).toISOString(), rate: '1 USDT ≈ 0.0000123 BTC' },
            { id: 'demo3', type: 'p2p', title: 'Buy USDT', asset: 'USDT', amount: '100.00', amountUSD: 103, network: 'M-Pesa', status: 'completed', date: new Date(Date.now() - 86400000).toISOString(), counterparty: 'Kwame_P2P' },
            { id: 'demo4', type: 'withdraw', title: 'Withdraw USDT', asset: 'USDT', amount: '200.00', amountUSD: 200, network: 'TRC20', status: 'pending', date: new Date(Date.now() - 172800000).toISOString(), address: 'TKy8cG0n...', fee: 1 },
            { id: 'demo5', type: 'trade', title: 'Buy BTC', asset: 'BTC', amount: '0.05', amountUSD: 4050, network: '—', status: 'completed', date: new Date(Date.now() - 259200000).toISOString() }
          );
        }

        return txs;
      }

      const state = {
        txs: loadTransactions(),
        filter: 'all',
        search: '',
      };

      // ============================================================
      // FORMAT
      // ============================================================
      function fmtUSD(n) {
        return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function fmtAmount(n) {
        const num = parseFloat(n) || 0;
        if (num >= 1000) return num.toLocaleString('en-US', { maximumFractionDigits: 2 });
        if (num >= 1) return num.toFixed(2);
        return num.toFixed(6);
      }

      function parseDate(d) {
        try {
          return new Date(d);
        } catch (e) {
          return new Date();
        }
      }

      function formatRelativeTime(d) {
        const date = parseDate(d);
        const now = new Date();
        const diff = (now - date) / 1000;
        if (diff < 60) return 'Just now';
        if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
        if (diff < 86400) return Math.floor(diff / 3600) + ' hr ago';
        if (diff < 604800) return Math.floor(diff / 86400) + ' day' + (Math.floor(diff / 86400) > 1 ? 's' : '') + ' ago';
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      function formatDateGroup(d) {
        const date = parseDate(d);
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const dDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

        if (dDate.getTime() === today.getTime()) return 'Today';
        if (dDate.getTime() === yesterday.getTime()) return 'Yesterday';
        if (date.getFullYear() === now.getFullYear()) {
          return date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        }
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      // ============================================================
      // ICONS
      // ============================================================
      function getIcon(type) {
        const map = {
          deposit: '↓',
          withdraw: '↑',
          swap: '⇄',
          trade: '📈',
          p2p: '🤝',
          bot: '🤖',
        };
        return map[type] || '•';
      }

      function getIconClass(type) {
        return type;
      }

      // ============================================================
      // FILTER & SEARCH
      // ============================================================
      function getFiltered() {
        let list = state.txs;
        if (state.filter !== 'all') {
          list = list.filter(t => t.type === state.filter);
        }
        if (state.search) {
          const q = state.search.toLowerCase();
          list = list.filter(t =>
            (t.title || '').toLowerCase().includes(q) ||
            (t.asset || '').toLowerCase().includes(q) ||
            (t.address || '').toLowerCase().includes(q) ||
            (t.id || '').toLowerCase().includes(q)
          );
        }
        // Sort by date desc
        list.sort((a, b) => parseDate(b.date) - parseDate(a.date));
        return list;
      }

      // ============================================================
      // RENDER
      // ============================================================
      function updateStats() {
        let totalIn = 0, totalOut = 0;
        state.txs.forEach(t => {
          const usd = parseFloat(t.amountUSD) || 0;
          if (t.type === 'deposit' || t.type === 'trade') {
            totalIn += usd;
          } else {
            totalOut += usd;
          }
        });
        $('#totalIn').textContent = fmtUSD(totalIn);
        $('#totalOut').textContent = fmtUSD(totalOut);
        $('#cnt-all').textContent = state.txs.length;
      }

      function renderList() {
        const list = getFiltered();
        const container = $('#txList');

        if (list.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="icon">📭</div>
              <h3>No transactions found</h3>
              <p>Try adjusting your filters or search. Your transactions will appear here after you make them.</p>
            </div>
          `;
          return;
        }

        // Group by date
        const groups = {};
        list.forEach(t => {
          const label = formatDateGroup(t.date);
          if (!groups[label]) groups[label] = [];
          groups[label].push(t);
        });

        let html = '';
        Object.keys(groups).forEach(label => {
          html += `<div class="tx-group">
            <div class="tx-group-label">${label}</div>`;
          groups[label].forEach(t => {
            const isPositive = t.type === 'deposit' || t.type === 'trade';
            const sign = isPositive ? '+' : '-';
            const cls = isPositive ? 'positive' : 'negative';
            html += `
              <div class="tx-item" data-tx-id="${t.id}">
                <div class="tx-icon ${getIconClass(t.type)}">${getIcon(t.type)}</div>
                <div class="tx-content">
                  <div class="tx-title-row">
                    <div class="tx-title">${t.title}</div>
                    <span class="tx-badge ${t.status}">${t.status}</span>
                  </div>
                  <div class="tx-meta">
                    <span>${formatRelativeTime(t.date)}</span>
                    <span class="sep"></span>
                    <span>${t.network || '—'}</span>
                  </div>
                </div>
                <div class="tx-amount-col">
                  <div class="tx-amount ${cls}">${sign}${fmtAmount(t.amount)} ${t.asset}</div>
                  <div class="tx-amount-usd">${fmtUSD(t.amountUSD)}</div>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        });

        container.innerHTML = html;

        // Bind clicks
        container.querySelectorAll('.tx-item').forEach(el => {
          el.addEventListener('click', () => {
            const id = el.dataset.txId;
            const tx = state.txs.find(t => t.id === id);
            if (tx) openDetail(tx);
          });
        });
      }

      // ============================================================
      // DETAIL MODAL
      // ============================================================
      const detailModal = $('#detailModal');
      const detailOverlay = $('#detailOverlay');
      const detailBody = $('#detailBody');

      function openDetail(tx) {
        const isPositive = tx.type === 'deposit' || tx.type === 'trade';
        const sign = isPositive ? '+' : '-';
        const cls = isPositive ? 'positive' : 'negative';

        let extraRows = '';
        if (tx.address) {
          extraRows += `
            <div class="detail-row">
              <span class="dr-label">Address</span>
              <span class="dr-value"><code>${tx.address}</code></span>
            </div>
          `;
        }
        if (tx.network && tx.network !== '—') {
          extraRows += `
            <div class="detail-row">
              <span class="dr-label">Network</span>
              <span class="dr-value">${tx.network}</span>
            </div>
          `;
        }
        if (tx.counterparty) {
          extraRows += `
            <div class="detail-row">
              <span class="dr-label">Counterparty</span>
              <span class="dr-value">${tx.counterparty}</span>
            </div>
          `;
        }
        if (tx.rate) {
          extraRows += `
            <div class="detail-row">
              <span class="dr-label">Rate</span>
              <span class="dr-value">${tx.rate}</span>
            </div>
          `;
        }
        if (tx.fee) {
          extraRows += `
            <div class="detail-row">
              <span class="dr-label">Network Fee</span>
              <span class="dr-value">${fmtAmount(tx.fee)} ${tx.asset}</span>
            </div>
          `;
        }

        detailBody.innerHTML = `
          <div class="detail-hero">
            <div class="detail-icon ${tx.type}">${getIcon(tx.type)}</div>
            <div class="detail-amount ${cls}">${sign}${fmtAmount(tx.amount)} ${tx.asset}</div>
            <div class="detail-usd">${fmtUSD(tx.amountUSD)}</div>
            <div class="detail-status-badge ${tx.status}">${tx.status}</div>
          </div>
          <div class="detail-rows">
            <div class="detail-row">
              <span class="dr-label">Type</span>
              <span class="dr-value" style="text-transform:capitalize;">${tx.type}</span>
            </div>
            <div class="detail-row">
              <span class="dr-label">Date</span>
              <span class="dr-value">${parseDate(tx.date).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
            </div>
            ${extraRows}
            <div class="detail-row">
              <span class="dr-label">Transaction ID</span>
              <span class="dr-value"><code>${tx.id}</code><button class="copy-mini" data-copy="${tx.id}">Copy</button></span>
            </div>
          </div>
          <div class="detail-actions">
            ${tx.status === 'pending' ? '<button class="btn-detail primary" id="viewBlockchainBtn">View on Blockchain</button>' : ''}
            <button class="btn-detail" id="shareBtn">Share Receipt</button>
            <button class="btn-detail" id="supportBtn">Contact Support</button>
          </div>
        `;

        // Bind mini copy
        detailBody.querySelectorAll('[data-copy]').forEach(btn => {
          btn.addEventListener('click', () => {
            const val = btn.dataset.copy;
            if (navigator.clipboard) {
              navigator.clipboard.writeText(val).then(() => showToast('Copied!'));
            }
          });
        });

        const vbtn = detailBody.querySelector('#viewBlockchainBtn');
        if (vbtn) {
          vbtn.addEventListener('click', () => showToast('Opening block explorer…'));
        }

        const shareBtn = detailBody.querySelector('#shareBtn');
        if (shareBtn) {
          shareBtn.addEventListener('click', () => showToast('Receipt link copied!'));
        }

        const supportBtn = detailBody.querySelector('#supportBtn');
        if (supportBtn) {
          supportBtn.addEventListener('click', () => showToast('Opening support chat…'));
        }

        detailOverlay.classList.add('open');
        detailModal.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeDetail() {
        detailOverlay.classList.remove('open');
        detailModal.classList.remove('open');
        document.body.style.overflow = '';
      }

      detailOverlay.addEventListener('click', closeDetail);
      $('#detailClose').addEventListener('click', closeDetail);

      // ============================================================
      // FILTERS
      // ============================================================
      $$('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          $$('.filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          state.filter = tab.dataset.filter;
          renderList();
        });
      });

      // ============================================================
      // SEARCH
      // ============================================================
      $('#searchInput').addEventListener('input', (e) => {
        state.search = e.target.value.trim();
        renderList();
      });

      // ============================================================
      // EXPORT
      // ============================================================
      $('#exportBtn').addEventListener('click', () => {
        const list = getFiltered();
        if (list.length === 0) {
          showToast('No transactions to export');
          return;
        }
        const csv = ['ID,Type,Title,Asset,Amount,USD,Status,Date,Network']
          .concat(list.map(t =>
            `${t.id},${t.type},"${t.title}",${t.asset},${t.amount},${t.amountUSD},${t.status},${t.date},${t.network || ''}`
          )).join('\n');

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'bluepeak-transactions-' + Date.now() + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Exported ' + list.length + ' transactions');
      });

      // ============================================================
      // NAV
      // ============================================================
      $('#backBtn').addEventListener('click', () => window.location.href = 'wallet.html');
      $$('.bottom-nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const nav = btn.dataset.nav;
          if (nav === 'home') window.location.href = 'index.html';
          if (nav === 'p2p') window.location.href = 'p2p.html';
          if (nav === 'trade') window.location.href = 'trade.html';
          if (nav === 'swap') window.location.href = 'swap.html';
          if (nav === 'wallet') window.location.href = 'wallet.html';
        });
      });

      // ============================================================
      // INIT
      // ============================================================
      updateStats();
      renderList();

    })();
  </script>
</body>
</html>
