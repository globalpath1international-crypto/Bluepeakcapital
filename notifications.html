<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Notifications — Bluepeak Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy-900: #0A1A2F;
      --navy-800: #10243E;
      --navy-700: #1A3352;
      --navy-100: #E8EDF4;
      --navy-50:  #F2F5FA;
      --gold-500: #C9A84C;
      --gold-400: #DDBE6B;
      --gold-100: #FBF5E6;
      --green-500: #0F9D6E;
      --green-100: #E6F7F1;
      --red-500: #D14343;
      --red-100: #FDECEC;
      --blue-500: #2563EB;
      --blue-100: #DBEAFE;
      --white: #FFFFFF;
      --gray-100: #F1F4F9;
      --gray-200: #E3E8EF;
      --gray-300: #CDD5E0;
      --gray-400: #94A3B8;
      --gray-500: #64748B;
      --gray-600: #475569;
      --bg-main: #FAFBFD;
      --shadow-xs: 0 1px 2px rgba(10, 26, 47, 0.04);
      --shadow-sm: 0 2px 8px rgba(10, 26, 47, 0.05);
      --shadow-md: 0 8px 24px rgba(10, 26, 47, 0.07);
      --shadow-lg: 0 16px 48px rgba(10, 26, 47, 0.10);
      --shadow-gold: 0 4px 16px rgba(201, 168, 76, 0.25);
      --radius-xs: 8px;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --radius-pill: 999px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html { height: 100%; scroll-behavior: smooth; }
    body {
      font-family: var(--font); background-color: var(--bg-main);
      color: var(--navy-900); line-height: 1.45;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      padding-bottom: 92px; min-height: 100vh; display: flex;
      flex-direction: column; overflow-x: hidden;
    }

    /* HEADER */
    .notif-header {
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px);
      padding: 10px 16px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid var(--gray-200);
      position: sticky; top: 0; z-index: 30; gap: 8px;
    }
    .notif-header-left { display: flex; align-items: center; gap: 8px; flex-shrink: 1; min-width: 0; }
    .icon-btn {
      background: none; border: none; padding: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-xs); color: var(--navy-900);
      transition: background 0.2s; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--navy-50); }
    .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .header-title { font-size: 17px; font-weight: 800; color: var(--navy-900); letter-spacing: -0.3px; }
    .header-actions { display: flex; align-items: center; gap: 4px; }
    .mark-read-btn {
      background: var(--navy-50); border: 1px solid var(--gray-200);
      padding: 6px 12px; border-radius: var(--radius-pill);
      font-family: var(--font); font-size: 11.5px; font-weight: 700;
      color: var(--navy-900); cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .mark-read-btn:hover { background: var(--navy-900); color: var(--white); border-color: var(--navy-900); }

    /* MAIN */
    .notif-main {
      flex: 1; padding: 16px 16px 0; max-width: 600px;
      margin: 0 auto; width: 100%;
      display: flex; flex-direction: column; gap: 12px;
    }

    /* STATS BAR */
    .notif-stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    }
    .notif-stat {
      background: var(--white); border: 1px solid var(--gray-200);
      border-radius: var(--radius-md); padding: 12px 14px;
      box-shadow: var(--shadow-xs);
      display: flex; flex-direction: column; gap: 2px;
    }
    .notif-stat .value {
      font-size: 20px; font-weight: 800; color: var(--navy-900);
      font-variant-numeric: tabular-nums; letter-spacing: -0.5px;
    }
    .notif-stat .value.gold { color: var(--gold-500); }
    .notif-stat .value.green { color: var(--green-500); }
    .notif-stat .label {
      font-size: 10.5px; font-weight: 700; color: var(--gray-500);
      text-transform: uppercase; letter-spacing: 0.4px;
    }

    /* FILTER TABS */
    .filter-tabs {
      display: flex; gap: 6px; overflow-x: auto;
      scrollbar-width: none; padding-bottom: 4px;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab {
      padding: 8px 16px; border-radius: var(--radius-pill);
      background: var(--white); border: 1px solid var(--gray-200);
      font-family: var(--font); font-size: 12.5px; font-weight: 700;
      color: var(--gray-500); cursor: pointer; transition: all 0.2s;
      flex-shrink: 0; white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
    }
    .filter-tab:hover { border-color: var(--gold-500); color: var(--navy-900); }
    .filter-tab.active { background: var(--navy-900); border-color: var(--navy-900); color: var(--white); }
    .filter-tab .count {
      background: var(--gray-200); color: var(--navy-900);
      font-size: 10px; font-weight: 800; padding: 1px 6px;
      border-radius: var(--radius-pill); min-width: 18px; text-align: center;
    }
    .filter-tab.active .count {
      background: var(--gold-500); color: var(--white);
    }

    /* NOTIFICATION LIST */
    .notif-list {
      display: flex; flex-direction: column; gap: 8px;
    }

    .notif-card {
      background: var(--white); border: 1px solid var(--gray-200);
      border-radius: var(--radius-md); padding: 14px 16px;
      display: flex; gap: 12px; cursor: pointer;
      transition: all 0.2s; position: relative;
      box-shadow: var(--shadow-xs);
    }
    .notif-card:hover { border-color: var(--gold-500); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
    .notif-card.unread {
      background: linear-gradient(135deg, #FFFFFF 0%, #FDFBF5 100%);
      border-color: rgba(201, 168, 76, 0.35);
    }
    .notif-card.unread::before {
      content: ''; position: absolute; left: 0; top: 14px; bottom: 14px;
      width: 3px; background: var(--gold-500); border-radius: 0 2px 2px 0;
    }

    .notif-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .notif-icon.trade { background: var(--green-100); color: var(--green-500); }
    .notif-icon.security { background: var(--red-100); color: var(--red-500); }
    .notif-icon.wallet { background: var(--blue-100); color: var(--blue-500); }
    .notif-icon.promo { background: var(--gold-100); color: var(--gold-500); }
    .notif-icon.system { background: var(--navy-50); color: var(--navy-700); }
    .notif-icon.kyc { background: #EDE9FE; color: #7C3AED; }

    .notif-content { flex: 1; min-width: 0; }
    .notif-title-row {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 3px;
    }
    .notif-title {
      font-size: 14px; font-weight: 800; color: var(--navy-900);
      line-height: 1.3;
    }
    .notif-unread-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold-500); flex-shrink: 0;
    }
    .notif-body {
      font-size: 12.5px; font-weight: 500; color: var(--gray-600);
      line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .notif-meta {
      display: flex; align-items: center; gap: 8px; margin-top: 8px;
      font-size: 11px; font-weight: 600; color: var(--gray-500);
    }
    .notif-meta .sep {
      width: 3px; height: 3px; border-radius: 50%; background: var(--gray-300);
    }
    .notif-action {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 10px; border-radius: var(--radius-xs);
      background: var(--navy-900); color: var(--white);
      font-size: 11px; font-weight: 800; cursor: pointer;
      border: none; font-family: var(--font);
      margin-top: 8px;
      transition: background 0.2s;
    }
    .notif-action:hover { background: var(--navy-800); }
    .notif-action.gold { background: var(--gold-500); color: var(--navy-900); }
    .notif-action.gold:hover { background: var(--gold-400); }

    /* EMPTY STATE */
    .empty-state {
      text-align: center; padding: 60px 24px;
      background: var(--white); border: 1px dashed var(--gray-300);
      border-radius: var(--radius-lg);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state h3 {
      font-size: 15px; font-weight: 800; color: var(--navy-900);
      margin-bottom: 4px;
    }
    .empty-state p {
      font-size: 13px; font-weight: 500; color: var(--gray-500);
      line-height: 1.5; max-width: 280px; margin: 0 auto;
    }

    /* TOAST */
    .toast {
      position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--navy-900); color: var(--white);
      padding: 12px 20px; border-radius: var(--radius-pill);
      font-size: 13px; font-weight: 700; z-index: 200;
      opacity: 0; pointer-events: none; transition: all 0.3s;
      max-width: calc(100% - 40px); text-align: center;
      box-shadow: 0 8px 24px rgba(10, 26, 47, 0.3);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 700px; background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(16px); border-top: 1px solid var(--gray-200);
      display: flex; justify-content: space-around; align-items: center;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 40; box-shadow: 0 -4px 20px rgba(10, 26, 47, 0.06);
    }
    .bottom-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; cursor: pointer;
      padding: 6px 8px; border-radius: var(--radius-sm);
      transition: all 0.2s; flex: 1; max-width: 80px;
      color: var(--gray-500); font-family: var(--font);
      font-size: 10px; font-weight: 600; letter-spacing: 0.2px;
    }
    .bottom-nav-item.active { color: var(--navy-900); font-weight: 800; }
    .bottom-nav-item.active .bn-icon-wrap { background: var(--navy-900); }
    .bottom-nav-item.active .bn-icon-wrap svg { stroke: var(--gold-400); }
    .bn-icon-wrap {
      width: 38px; height: 26px; border-radius: var(--radius-xs);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .bottom-nav-item svg {
      width: 20px; height: 20px; stroke: currentColor; fill: none;
      stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
    }

    @media (min-width: 700px) {
      body { padding-bottom: 100px; }
      .notif-main { max-width: 640px; padding: 20px 24px 0; }
      .bottom-nav { max-width: 900px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    }
  </style>
</head>
<body>

  <header class="notif-header">
    <div class="notif-header-left">
      <button class="icon-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="header-title">Notifications</span>
    </div>
    <div class="header-actions">
      <button class="mark-read-btn" id="markAllReadBtn">Mark all read</button>
    </div>
  </header>

  <main class="notif-main">

    <!-- STATS -->
    <div class="notif-stats">
      <div class="notif-stat">
        <div class="value gold" id="unreadCount">0</div>
        <div class="label">Unread</div>
      </div>
      <div class="notif-stat">
        <div class="value" id="totalCount">0</div>
        <div class="label">Total</div>
      </div>
      <div class="notif-stat">
        <div class="value green" id="todayCount">0</div>
        <div class="label">Today</div>
      </div>
    </div>

    <!-- FILTERS -->
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">All <span class="count" id="cnt-all">0</span></button>
      <button class="filter-tab" data-filter="unread">Unread <span class="count" id="cnt-unread">0</span></button>
      <button class="filter-tab" data-filter="trade">Trades</button>
      <button class="filter-tab" data-filter="wallet">Wallet</button>
      <button class="filter-tab" data-filter="security">Security</button>
      <button class="filter-tab" data-filter="system">System</button>
    </div>

    <!-- LIST -->
    <div class="notif-list" id="notifList"></div>

  </main>

  <nav class="bottom-nav">
    <button class="bottom-nav-item" data-nav="home">
      <div class="bn-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></div>
      <span>Home</span>
    </button>
    <button class="bottom-nav-item" data-nav="p2p">
      <div class="bn-icon-wrap"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.8-3.5 3.2-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="8" r="2.8"/><path d="M15.5 14c2.5 0 4.8 1.5 5.5 4.5"/></svg></div>
      <span>P2P</span>
    </button>
    <button class="bottom-nav-item" data-nav="trade">
      <div class="bn-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 20L9 14l4 4 8-8"/><path d="M17 10h4v4"/></svg></div>
      <span>Trade</span>
    </button>
    <button class="bottom-nav-item" data-nav="swap">
      <div class="bn-icon-wrap"><svg viewBox="0 0 24 24"><path d="M7 4v13M7 17l-3-3M7 17l3-3"/><path d="M17 20V7M17 7l3 3M17 7l-3 3"/></svg></div>
      <span>Swap</span>
    </button>
    <button class="bottom-nav-item active" data-nav="wallet">
      <div class="bn-icon-wrap"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M16 13h.01"/><path d="M2 9h20"/></svg></div>
      <span>Wallet</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    (function() {
      'use strict';

      const $ = (s) => document.querySelector(s);
      const $$ = (s) => document.querySelectorAll(s);
      const toastEl = $('#toast');

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2600);
      }

      // ============================================================
      // DEMO NOTIFICATIONS (with persistence)
      // ============================================================
      const DEFAULT_NOTIFICATIONS = [
        {
          id: 'n1',
          type: 'security',
          title: 'New login detected',
          body: 'A new login was detected from Chrome on Windows in San Francisco, US. If this wasn\'t you, secure your account immediately.',
          time: '5 minutes ago',
          unread: true,
          action: { label: 'Secure Account', type: 'danger' },
        },
        {
          id: 'n2',
          type: 'wallet',
          title: 'Deposit confirmed',
          body: 'Your deposit of 500 USDT has been confirmed and added to your wallet. You can now trade or withdraw these funds.',
          time: '18 minutes ago',
          unread: true,
          action: { label: 'View Wallet', type: 'primary' },
        },
        {
          id: 'n3',
          type: 'trade',
          title: 'P2P order completed',
          body: 'Your order #ORD-849201 has been marked as completed. The escrow funds have been released to your wallet.',
          time: '1 hour ago',
          unread: true,
          action: { label: 'View Order', type: 'primary' },
        },
        {
          id: 'n4',
          type: 'kyc',
          title: 'KYC Verification approved',
          body: 'Congratulations! Your Level 1 identity verification has been approved. Your daily limits have been increased.',
          time: '3 hours ago',
          unread: false,
          action: { label: 'Verify Level 2', type: 'gold' },
        },
        {
          id: 'n5',
          type: 'trade',
          title: 'Price alert: BTC above $85,000',
          body: 'Bitcoin has crossed your target price of $85,000. Current price: $85,120. Consider taking profit or adjusting positions.',
          time: '5 hours ago',
          unread: false,
          action: { label: 'Trade BTC', type: 'primary' },
        },
        {
          id: 'n6',
          type: 'promo',
          title: 'Zero fees on P2P trades this weekend',
          body: 'Enjoy zero maker fees on all P2P trades until Sunday midnight. Start trading now and save on every order.',
          time: 'Yesterday',
          unread: false,
          action: { label: 'Explore P2P', type: 'gold' },
        },
        {
          id: 'n7',
          type: 'system',
          title: 'Scheduled maintenance',
          body: 'Bluepeak Capital will undergo scheduled maintenance on Sunday, 2:00–4:00 UTC. Some services may be temporarily unavailable.',
          time: 'Yesterday',
          unread: false,
          action: null,
        },
        {
          id: 'n8',
          type: 'wallet',
          title: 'Withdrawal processed',
          body: 'Your withdrawal of 250 USDT (TRC20) has been processed and sent to your external wallet. TX: 0x7a3f...9d2e',
          time: '2 days ago',
          unread: false,
          action: { label: 'View Transaction', type: 'primary' },
        },
        {
          id: 'n9',
          type: 'security',
          title: 'Password successfully changed',
          body: 'Your account password was changed successfully. If this wasn\'t you, contact support immediately.',
          time: '3 days ago',
          unread: false,
          action: null,
        },
        {
          id: 'n10',
          type: 'trade',
          title: 'New P2P offer matched',
          body: 'Your buy order for 100 USDT at $1.02 was matched with a verified merchant. Please complete the payment within 15 minutes.',
          time: '3 days ago',
          unread: false,
          action: { label: 'View Order', type: 'primary' },
        },
      ];

      const state = {
        notifications: loadNotifications(),
        filter: 'all',
      };

      function loadNotifications() {
        const saved = localStorage.getItem('bp_notifications');
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {
            return DEFAULT_NOTIFICATIONS;
          }
        }
        return DEFAULT_NOTIFICATIONS;
      }

      function saveNotifications() {
        localStorage.setItem('bp_notifications', JSON.stringify(state.notifications));
      }

      function updateBadgeInHeader() {
        const unreadCount = state.notifications.filter(n => n.unread).length;
        // Store for other pages
        localStorage.setItem('bp_unread_notifications', String(unreadCount));
      }

      // ============================================================
      // STATS
      // ============================================================
      function updateStats() {
        const unread = state.notifications.filter(n => n.unread).length;
        const total = state.notifications.length;
        // Today = notifications with time starting with "minute" or "hour" or "Just now"
        const today = state.notifications.filter(n => 
          n.time.toLowerCase().includes('minute') ||
          n.time.toLowerCase().includes('hour') ||
          n.time.toLowerCase().includes('just now')
        ).length;

        $('#unreadCount').textContent = unread;
        $('#totalCount').textContent = total;
        $('#todayCount').textContent = today;
        $('#cnt-all').textContent = total;
        $('#cnt-unread').textContent = unread;
        updateBadgeInHeader();
      }

      // ============================================================
      // RENDER
      // ============================================================
      function getFiltered() {
        if (state.filter === 'all') return state.notifications;
        if (state.filter === 'unread') return state.notifications.filter(n => n.unread);
        return state.notifications.filter(n => n.type === state.filter);
      }

      function renderList() {
        const list = getFiltered();
        const container = $('#notifList');

        if (list.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="icon">🔔</div>
              <h3>No notifications</h3>
              <p>You're all caught up. New notifications will appear here.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = list.map(n => {
          const iconMap = {
            trade: '📈',
            security: '🛡️',
            wallet: '💰',
            promo: '🎁',
            system: '⚙️',
            kyc: '🪪',
          };
          const actionClass = n.action?.type === 'danger' ? 'notif-action' : 
                              n.action?.type === 'gold' ? 'notif-action gold' : 
                              'notif-action';
          const actionHtml = n.action ? `<button class="${actionClass}" data-action-id="${n.id}">${n.action.label}</button>` : '';

          return `
            <div class="notif-card ${n.unread ? 'unread' : ''}" data-notif-id="${n.id}">
              <div class="notif-icon ${n.type}">${iconMap[n.type] || '🔔'}</div>
              <div class="notif-content">
                <div class="notif-title-row">
                  <div class="notif-title">${n.title}</div>
                  ${n.unread ? '<span class="notif-unread-dot"></span>' : ''}
                </div>
                <div class="notif-body">${n.body}</div>
                <div class="notif-meta">
                  <span>${n.time}</span>
                  <span class="sep"></span>
                  <span style="text-transform:capitalize;">${n.type}</span>
                </div>
                ${actionHtml}
              </div>
            </div>
          `;
        }).join('');

        // Card click → mark as read
        container.querySelectorAll('.notif-card').forEach(card => {
          card.addEventListener('click', (e) => {
            if (e.target.closest('.notif-action')) return;
            const id = card.dataset.notifId;
            const notif = state.notifications.find(n => n.id === id);
            if (notif && notif.unread) {
              notif.unread = false;
              saveNotifications();
              updateStats();
              renderList();
            }
          });
        });

        // Action button click
        container.querySelectorAll('.notif-action').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.dataset.actionId;
            const notif = state.notifications.find(n => n.id === id);
            if (!notif) return;

            // Mark as read on action
            if (notif.unread) {
              notif.unread = false;
              saveNotifications();
              updateStats();
            }

            // Route based on type
            const actionLabel = notif.action.label.toLowerCase();
            if (actionLabel.includes('secure')) {
              showToast('Opening security settings…');
              setTimeout(() => window.location.href = 'settings.html', 800);
            } else if (actionLabel.includes('wallet')) {
              showToast('Opening wallet…');
              setTimeout(() => window.location.href = 'wallet.html', 800);
            } else if (actionLabel.includes('order')) {
              showToast('Opening order details…');
              setTimeout(() => window.location.href = 'p2p.html', 800);
            } else if (actionLabel.includes('verify')) {
              showToast('Opening verification…');
              setTimeout(() => window.location.href = 'settings.html', 800);
            } else if (actionLabel.includes('trade')) {
              showToast('Opening trade page…');
              setTimeout(() => window.location.href = 'trade.html', 800);
            } else if (actionLabel.includes('explore')) {
              showToast('Opening P2P marketplace…');
              setTimeout(() => window.location.href = 'p2p.html', 800);
            } else if (actionLabel.includes('transaction')) {
              showToast('Opening transaction details…');
              setTimeout(() => window.location.href = 'wallet.html', 800);
            } else {
              showToast('Opening…');
            }
            renderList();
          });
        });
      }

      // ============================================================
      // FILTERS
      // ============================================================
      $$('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          $$('.filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          state.filter = tab.dataset.filter;
          renderList();
        });
      });

      // ============================================================
      // MARK ALL READ
      // ============================================================
      $('#markAllReadBtn').addEventListener('click', () => {
        const unread = state.notifications.filter(n => n.unread).length;
        if (unread === 0) {
          showToast('All caught up');
          return;
        }
        state.notifications.forEach(n => n.unread = false);
        saveNotifications();
        updateStats();
        renderList();
        showToast(`Marked ${unread} notification${unread > 1 ? 's' : ''} as read`);
      });

      // ============================================================
      // NAVIGATION
      // ============================================================
      $('#backBtn').addEventListener('click', () => window.location.href = 'index.html');
      $$('.bottom-nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const nav = btn.dataset.nav;
          if (nav === 'home') window.location.href = 'index.html';
          if (nav === 'p2p') window.location.href = 'p2p.html';
          if (nav === 'trade') window.location.href = 'trade.html';
          if (nav === 'swap') window.location.href = 'swap.html';
          if (nav === 'wallet') window.location.href = 'wallet.html';
        });
      });

      // ============================================================
      // INIT
      // ============================================================
      updateStats();
      renderList();

    })();
  </script>
</body>
</html>
