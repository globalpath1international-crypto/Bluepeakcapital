<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Wallet — Bluepeak Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       BLUEPEAK CAPITAL — WALLET DASHBOARD
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy-900: #0A1A2F;
      --navy-800: #10243E;
      --navy-700: #1A3352;
      --navy-100: #E8EDF4;
      --navy-50:  #F2F5FA;
      --gold-500: #C9A84C;
      --gold-400: #DDBE6B;
      --gold-100: #FBF5E6;
      --green-500: #0F9D6E;
      --green-100: #E6F7F1;
      --red-500: #D14343;
      --red-100: #FDECEC;
      --white: #FFFFFF;
      --gray-100: #F1F4F9;
      --gray-200: #E3E8EF;
      --gray-300: #CDD5E0;
      --gray-400: #94A3B8;
      --gray-500: #64748B;
      --gray-600: #475569;
      --bg-main: #FAFBFD;
      --shadow-xs: 0 1px 2px rgba(10, 26, 47, 0.04);
      --shadow-sm: 0 2px 8px rgba(10, 26, 47, 0.05);
      --shadow-md: 0 8px 24px rgba(10, 26, 47, 0.07);
      --shadow-lg: 0 16px 48px rgba(10, 26, 47, 0.10);
      --shadow-gold: 0 4px 16px rgba(201, 168, 76, 0.25);
      --radius-xs: 8px;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --radius-pill: 999px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html { height: 100%; scroll-behavior: smooth; }
    body {
      font-family: var(--font); background-color: var(--bg-main);
      color: var(--navy-900); line-height: 1.45;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      padding-bottom: 96px; min-height: 100vh; display: flex;
      flex-direction: column; overflow-x: hidden;
    }

    /* HEADER */
    .wallet-header {
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px);
      padding: 10px 16px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid var(--gray-200);
      position: sticky; top: 0; z-index: 30; gap: 8px;
    }
    .wallet-header-left { display: flex; align-items: center; gap: 4px; flex-shrink: 1; min-width: 0; }
    .icon-btn {
      background: none; border: none; padding: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-xs); color: var(--navy-900);
      transition: background 0.2s; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--navy-50); }
    .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .header-title { font-size: 18px; font-weight: 800; color: var(--navy-900); letter-spacing: -0.4px; margin-left: 4px; }

    /* MAIN */
    .wallet-main {
      flex: 1; padding: 16px 16px 0; max-width: 600px;
      margin: 0 auto; width: 100%;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* BALANCE CARD */
    .balance-card {
      background: linear-gradient(135deg, var(--navy-900), var(--navy-800));
      border-radius: var(--radius-lg); padding: 24px 22px;
      color: var(--white); position: relative; overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    .balance-card::before {
      content: ''; position: absolute; top: -40%; right: -20%;
      width: 220px; height: 220px; border-radius: 50%;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.18), transparent 70%);
      pointer-events: none;
    }
    .balance-card-label { font-size: 12px; font-weight: 600; color: var(--gray-300); text-transform: uppercase; letter-spacing: 0.8px; position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; }
    .balance-card-label .eye-toggle-inline {
      background: rgba(255,255,255,0.12); border: none; width: 26px; height: 26px;
      border-radius: 50%; cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--gold-400); transition: background 0.2s;
    }
    .balance-card-label .eye-toggle-inline:hover { background: rgba(255,255,255,0.2); }
    .balance-card-label .eye-toggle-inline svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    
    /* LOCKED CURRENCY BUTTON + AUTO-FIT BALANCE ROW */
    .balance-card-value {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-top: 8px; position: relative; z-index: 1;
      width: 100%;
    }
    #totalBalance {
      font-size: 38px; font-weight: 800; letter-spacing: -1.2px;
      font-variant-numeric: tabular-nums; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
      transition: font-size 0.1s ease;
    }
    .currency-pill-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: var(--gold-400); font-family: var(--font);
      font-size: 12px; font-weight: 800; padding: 6px 12px;
      border-radius: var(--radius-pill); cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      flex-shrink: 0; transition: all 0.2s; white-space: nowrap;
    }
    .currency-pill-btn:hover { background: rgba(255, 255, 255, 0.22); border-color: var(--gold-400); }
    .currency-pill-btn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.5; }

    .balance-card-sub { font-size: 12.5px; font-weight: 600; margin-top: 6px; position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #balancePctChange { font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; gap: 3px; }
    .balance-card-sub .stat { color: var(--gray-300); }
    
    .balance-card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; position: relative; z-index: 1; }
    .bal-action-btn {
      padding: 13px; border-radius: var(--radius-pill); font-family: var(--font);
      font-weight: 800; font-size: 14.5px; cursor: pointer;
      transition: all 0.2s; border: none;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .bal-action-btn.deposit { background: linear-gradient(135deg, var(--green-500), #0B8A5E); color: #fff; box-shadow: 0 4px 14px rgba(15, 157, 110, 0.3); }
    .bal-action-btn.deposit:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(15, 157, 110, 0.42); }
    .bal-action-btn.withdraw { background: rgba(255, 255, 255, 0.12); color: #fff; border: 1px solid rgba(255, 255, 255, 0.18); }
    .bal-action-btn.withdraw:hover { background: rgba(255, 255, 255, 0.18); }

    /* RATE STRIP */
    .rate-strip {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--white); border: 1px solid var(--gray-200);
      border-radius: var(--radius-pill); padding: 10px 16px; box-shadow: var(--shadow-xs);
    }
    .rate-strip-left { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--gray-500); flex: 1; min-width: 0; }
    .rate-strip-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-500); animation: pulse 1.5s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .rate-strip-value { color: var(--navy-900); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rate-strip-refresh { background: none; border: none; cursor: pointer; color: var(--gray-500); display: flex; align-items: center; justify-content: center; padding: 4px; transition: color 0.2s; }
    .rate-strip-refresh:hover { color: var(--navy-900); }
    .rate-strip-refresh.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* SECTION TITLES */
    .section-title { font-size: 16px; font-weight: 800; color: var(--navy-900); letter-spacing: -0.3px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
    .section-title .sub { font-size: 12px; font-weight: 600; color: var(--gray-500); }

    /* ASSET LIST */
    .asset-card {
      background: var(--white); border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .asset-row {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 18px; border-bottom: 1px solid var(--gray-200);
      transition: background 0.15s; cursor: pointer; position: relative;
    }
    .asset-row:last-child { border-bottom: none; }
    .asset-row:hover { background: var(--navy-50); }
    .asset-row-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--navy-50); border: 1px solid var(--gray-200);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; padding: 6px;
    }
    .asset-row-icon img { width: 100%; height: 100%; object-fit: contain; }
    .asset-row-info { flex: 1; min-width: 0; }
    .asset-row-name { font-size: 14.5px; font-weight: 800; color: var(--navy-900); }
    .asset-row-symbol { font-size: 11.5px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.3px; margin-top: 1px; }
    .asset-live-price { font-size: 10.5px; font-weight: 600; color: var(--gray-400); margin-top: 1px; font-variant-numeric: tabular-nums; }
    .asset-row-balance { text-align: right; flex-shrink: 0; margin-right: 4px; }
    .asset-row-amount { font-size: 14.5px; font-weight: 800; color: var(--navy-900); font-variant-numeric: tabular-nums; }
    .asset-row-usd { font-size: 11.5px; font-weight: 600; color: var(--gray-500); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .asset-row-dots {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
      background: transparent; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--gray-500); transition: background 0.15s;
      font-size: 18px; font-weight: 800; line-height: 1;
    }
    .asset-row-dots:hover { background: var(--navy-50); color: var(--navy-900); }

    /* TRANSACTIONS */
    .tx-filter-row {
      display: flex; gap: 8px; overflow-x: auto;
      padding-bottom: 4px; scrollbar-width: none; margin-bottom: 8px;
    }
    .tx-filter-row::-webkit-scrollbar { display: none; }
    .tx-filter {
      padding: 8px 16px; border-radius: var(--radius-pill);
      background: var(--white); border: 1px solid var(--gray-200);
      font-family: var(--font); font-size: 12.5px; font-weight: 700;
      color: var(--gray-500); cursor: pointer; white-space: nowrap;
      transition: all 0.2s; flex-shrink: 0;
    }
    .tx-filter:hover { border-color: var(--gold-500); color: var(--navy-900); }
    .tx-filter.active { background: var(--navy-900); border-color: var(--navy-900); color: var(--white); }

    .tx-list {
      background: var(--white); border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .tx-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; border-bottom: 1px solid var(--gray-200);
      cursor: pointer; position: relative;
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-icon {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .tx-icon.deposit { background: var(--green-100); color: var(--green-500); }
    .tx-icon.withdraw { background: var(--red-100); color: var(--red-500); }
    .tx-icon.swap { background: var(--gold-100); color: var(--gold-500); }
    .tx-icon.trade { background: var(--navy-50); color: var(--navy-700); }
    .tx-info { flex: 1; min-width: 0; }
    .tx-title { font-size: 14px; font-weight: 800; color: var(--navy-900); }
    .tx-date { font-size: 11.5px; font-weight: 600; color: var(--gray-500); margin-top: 1px; }
    .activity-type-pill {
      display: inline-block; font-size: 10px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.5px;
      padding: 2px 8px; border-radius: var(--radius-pill); margin-top: 3px;
    }
    .activity-type-pill.deposit { background: var(--green-100); color: var(--green-500); }
    .activity-type-pill.withdraw { background: var(--red-100); color: var(--red-500); }
    .activity-type-pill.swap { background: var(--gold-100); color: var(--gold-500); }
    .activity-type-pill.trade { background: var(--navy-50); color: var(--navy-700); }
    .tx-amount { text-align: right; flex-shrink: 0; }
    .tx-amount-val { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .tx-amount-val.positive { color: var(--green-500); }
    .tx-amount-val.negative { color: var(--red-500); }
    .tx-status { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; color: var(--green-500); }
    .tx-status.pending { color: var(--gold-500); }
    .tx-status.failed { color: var(--red-500); }
    .tx-item-arrow {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--navy-50); color: var(--gray-500);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; flex-shrink: 0; margin-left: 6px;
    }
    .empty-tx { text-align: center; padding: 40px 20px; color: var(--gray-500); font-size: 13px; font-weight: 500; }

    /* MODAL SHEETS */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(10, 26, 47, 0.6); backdrop-filter: blur(4px);
      z-index: 70; opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    
    .bottom-sheet {
      position: fixed; bottom: 0; left: 0; width: 100%; max-height: 85vh;
      background: var(--white); z-index: 75;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .bottom-sheet.open { transform: translateY(0); }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px; border-bottom: 1px solid var(--gray-200); flex-shrink: 0;
    }
    .sheet-header h3 { font-size: 17px; font-weight: 800; color: var(--navy-900); }
    .sheet-close {
      background: var(--navy-50); border: none; width: 34px; height: 34px;
      border-radius: 50%; font-size: 16px; cursor: pointer; color: var(--navy-900);
      display: flex; align-items: center; justify-content: center;
    }
    .sheet-search { padding: 12px 20px; flex-shrink: 0; }
    .sheet-search input {
      width: 100%; padding: 12px 16px;
      border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 14px; font-weight: 500;
      background: var(--navy-50); color: var(--navy-900); outline: none;
    }
    .sheet-search input:focus { border-color: var(--gold-500); }
    .sheet-body { flex: 1; overflow-y: auto; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 8px; }

    /* CURRENCY ITEM IN MODAL */
    .currency-option {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 14px; border-radius: var(--radius-sm);
      cursor: pointer; transition: background 0.15s;
      border-bottom: 1px solid var(--gray-200);
    }
    .currency-option:last-child { border-bottom: none; }
    .currency-option:hover { background: var(--navy-50); }
    .currency-option.selected { background: var(--gold-100); }
    .currency-option.selected .curr-code { color: var(--gold-500); }
    .curr-name { font-size: 14px; font-weight: 800; color: var(--navy-900); }
    .curr-code { font-size: 12px; font-weight: 700; color: var(--gray-500); }

    /* ASSET ACTION ROW */
    .asset-action-row { display: flex; flex-direction: column; gap: 8px; }
    .asset-action-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 16px; border-radius: var(--radius-md);
      background: var(--white); border: 1.5px solid var(--gray-200);
      font-family: var(--font); font-size: 14px; font-weight: 800;
      color: var(--navy-900); cursor: pointer; text-align: left;
      transition: all 0.18s;
    }
    .asset-action-btn:hover { border-color: var(--gold-500); background: var(--gold-100); }
    .asset-action-btn .aab-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .asset-action-btn.deposit .aab-icon { background: var(--green-100); color: var(--green-500); }
    .asset-action-btn.withdraw .aab-icon { background: var(--red-100); color: var(--red-500); }
    .asset-action-btn .aab-sub { display: block; font-size: 11.5px; font-weight: 600; color: var(--gray-500); margin-top: 1px; }

    /* TX DETAIL */
    .tx-detail-row {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--gray-200); font-size: 13px;
    }
    .tx-detail-row:last-child { border-bottom: none; }
    .tx-detail-row .k { color: var(--gray-500); font-weight: 600; }
    .tx-detail-row .v { color: var(--navy-900); font-weight: 800; text-align: right; word-break: break-all; }
    .tx-status-pill {
      display: inline-block; padding: 3px 10px; border-radius: var(--radius-pill);
      font-size: 10.5px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase;
    }
    .tx-status-pill.completed { background: var(--green-100); color: var(--green-500); }
    .tx-status-pill.pending { background: var(--gold-100); color: var(--gold-500); }
    .tx-status-pill.failed { background: var(--red-100); color: var(--red-500); }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 600px; background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(16px); border-top: 1px solid var(--gray-200);
      display: flex; justify-content: space-around; align-items: center;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 40; box-shadow: 0 -4px 20px rgba(10, 26, 47, 0.06);
    }
    .bottom-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; cursor: pointer;
      padding: 6px 8px; border-radius: var(--radius-sm);
      transition: all 0.2s; flex-shrink: 0; flex: 1; max-width: 80px;
      color: var(--gray-500); font-family: var(--font);
      font-size: 10px; font-weight: 600; letter-spacing: 0.2px;
    }
    .bottom-nav-item.active { color: var(--navy-900); font-weight: 800; }
    .bottom-nav-item.active .bn-icon-wrap { background: var(--navy-900); }
    .bottom-nav-item.active .bn-icon-wrap svg { stroke: var(--gold-400); }
    .bn-icon-wrap {
      width: 38px; height: 26px; border-radius: var(--radius-xs);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .bottom-nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--navy-900); color: var(--white);
      padding: 12px 20px; border-radius: var(--radius-pill);
      font-size: 13px; font-weight: 700; z-index: 200;
      opacity: 0; pointer-events: none; transition: all 0.3s;
      max-width: calc(100% - 40px); text-align: center;
      box-shadow: 0 8px 24px rgba(10, 26, 47, 0.3);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (min-width: 700px) {
      body { padding-bottom: 100px; }
      .wallet-main { max-width: 640px; padding: 20px 24px 0; gap: 18px; }
      .bottom-nav { max-width: 640px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="wallet-header">
    <div class="wallet-header-left">
      <button class="icon-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="header-title">Wallet</span>
    </div>
    <button class="icon-btn" id="historyBtn" aria-label="History">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 15 15 15"/></svg>
    </button>
  </header>

  <!-- MAIN -->
  <main class="wallet-main">

    <!-- BALANCE CARD -->
    <div class="balance-card">
      <div class="balance-card-label">
        Total Balance
        <button class="eye-toggle-inline" id="balanceEyeToggle" aria-label="Toggle balance visibility">
          <svg id="balanceEyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <!-- AUTO-FIT VALUE & LOCKED CURRENCY BUTTON -->
      <div class="balance-card-value">
        <span id="totalBalance">$0.00</span>

  <!-- CURRENCY SELECTOR MODAL (BOTTOM-SHEET) -->
  <div class="modal-overlay" id="currencyModalOverlay"></div>
  <div class="bottom-sheet" id="currencyModal">

    </div>
    <div class="sheet-search">
      <input type="text" id="currencySearchInput" placeholder="Search currency (e.g. USD, KES, NGN)…" autocomplete="off">

    <div class="sheet-body" id="currencyList"></div>

  <!-- ASSET ACTION SHEET (per asset ⋮ menu) -->
  <div class="modal-overlay" id="sheetOverlay"></div>
  <div class="bottom-sheet" id="assetActionSheet">
    <div class="sheet-header">
      <h3 id="assetActionTitle">Asset</h3>
      <button class="sheet-close" id="assetActionClose">✕</button>
    </div>
    <div class="sheet-body">
      <div class="asset-action-row">
        <button class="asset-action-btn deposit" id="assetActionDeposit">
          <span class="aab-icon">↓</span>
          <span>Deposit <span class="aab-sub" id="assetActionDepositSub">Receive into your wallet</span></span>
        </button>
        <button class="asset-action-btn withdraw" id="assetActionWithdraw">
          <span class="aab-icon">↑</span>
          <span>Withdraw <span class="aab-sub" id="assetActionWithdrawSub">Send to an external address</span></span>
        </button>

  <!-- TX DETAIL SHEET -->
  <div class="bottom-sheet" id="txDetailSheet">
    <div class="sheet-header">
      <h3 id="txDetailTitle">Transaction Details</h3>
      <button class="sheet-close" id="txDetailClose">✕</button>
    </div>
    <div class="sheet-body" id="txDetailBody"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function() {
      'use strict';

      const $ = (s) => document.querySelector(s);
      const $$ = (s) => document.querySelectorAll(s);
      const toastEl = $('#toast');

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2600);
      }

      function navigateTo(url) {
        if (!url) return;
        window.location.href = url;
      }

      // ============================================================
      // MULTI-CURRENCY SUPPORT
      // ============================================================
      const CURRENCIES = [
        { code: 'USD', symbol: '$',   name: 'US Dollar',           fx: 1.0 },
        { code: 'EUR', symbol: '€',   name: 'Euro',                fx: 0.92 },
        { code: 'GBP', symbol: '£',   name: 'British Pound',       fx: 0.79 },
        { code: 'KES', symbol: 'KSh ',name: 'Kenyan Shilling',     fx: 130.5 },
        { code: 'NGN', symbol: '₦',   name: 'Nigerian Naira',      fx: 1480.0 },
        { code: 'ZAR', symbol: 'R ',  name: 'South African Rand',  fx: 18.2 },
        { code: 'TZS', symbol: 'TSh ',name: 'Tanzanian Shilling',  fx: 2600.0 },
        { code: 'UGX', symbol: 'USh ',name: 'Ugandan Shilling',    fx: 3700.0 },
        { code: 'GHS', symbol: 'GH₵', name: 'Ghanaian Cedi',       fx: 15.2 },
        { code: 'RWF', symbol: 'FRw ',name: 'Rwandan Franc',       fx: 1380.0 },
        { code: 'AED', symbol: 'AED ',name: 'UAE Dirham',          fx: 3.67 }
      ];

      function getSelectedCurrency() {
        try {
          const s = localStorage.getItem('bp_wallet_display_currency');
          if (s && CURRENCIES.find(c => c.code === s)) return s;
        } catch (_) {}
        return 'USD';
      }

      function setSelectedCurrency(code) {
        localStorage.setItem('bp_wallet_display_currency', code);
        $('#totalBalCurrencyLabel').textContent = code;
        renderCurrencies();
        refreshAllBalances();
      }

      function formatMoney(usdAmount) {
        const code = getSelectedCurrency();
        const cur = CURRENCIES.find(c => c.code === code) || CURRENCIES[0];
        const val = Number(usdAmount || 0) * cur.fx;
        const noDec = ['NGN', 'TZS', 'UGX', 'RWF'].includes(code);
        return cur.symbol + val.toLocaleString('en-US', {
          minimumFractionDigits: noDec ? 0 : 2,
          maximumFractionDigits: noDec ? 0 : 2
        });
      }

      // ============================================================
      // AUTO-SCALE TEXT TO PREVENT BUTTON FROM DISPLACING
      // ============================================================
      function fitTotalBalanceFont() {
        const el = document.getElementById('totalBalance');
        const btn = document.getElementById('currencyModalTrigger');
        if (!el || !btn) return;
        const container = el.closest('.balance-card-value');
        if (!container) return;

        const available = container.clientWidth - btn.offsetWidth - 14;
        let px = 38;
        el.style.fontSize = px + 'px';

        while (el.scrollWidth > available && px > 18) {
          px -= 1;
          el.style.fontSize = px + 'px';
        }
      }

      window.addEventListener('resize', fitTotalBalanceFont);

      // ============================================================
      // ASSETS LIST
      // ============================================================
      const ASSETS = [
        { symbol: 'USDT', name: 'Tether', icon: 'https://essamamdani.github.io/open-crypto-icons/icons/colored/usdt.svg', price: 1.0 },
        { symbol: 'BTC',  name: 'Bitcoin', icon: 'https://blockchains.tatum.io/assets/img/bitcoin.svg', price: 81000 },
        { symbol: 'ETH',  name: 'Ethereum', icon: 'https://blockchains.tatum.io/assets/img/ethereum.svg', price: 3200 },
        { symbol: 'SOL',  name: 'Solana', icon: 'https://blockchains.tatum.io/assets/img/solana.svg', price: 150 },
      ];

      let balanceVisible = true;
      let currentTxFilter = 'all';
      const TX = [];

      // ============================================================
      // STRICT REAL BALANCE ENGINE (NO PHANTOMS FOR NEW ACCOUNTS)
      // ============================================================
      function getRealAssetBalance(symbol) {
        // Direct symbol key
        const direct = localStorage.getItem('bp_balance_' + symbol);
        if (direct !== null && !isNaN(parseFloat(direct))) {
          return Math.max(0, parseFloat(direct));
        }

        // Encapsulated crypto map
        try {
          const map = JSON.parse(localStorage.getItem('bp_crypto_balances') || '{}');
          if (map[symbol] !== undefined && !isNaN(parseFloat(map[symbol]))) {
            return Math.max(0, parseFloat(map[symbol]));
          }
        } catch (_) {}

        // USDT: Read confirmed deposited balance from deposit.html / P2P
        if (symbol === 'USDT') {
          const uBal = parseFloat(localStorage.getItem('bp_user_balance') || localStorage.getItem('user_balance') || localStorage.getItem('bp_wallet_balance') || '0');
          return isNaN(uBal) ? 0 : Math.max(0, uBal);
        }

        return 0; // Strictly 0 for new user
      }

      function refreshAllBalances() {
        let totalPortfolioUsd = 0;

        ASSETS.forEach(a => {
          a.balance = getRealAssetBalance(a.symbol);
          totalPortfolioUsd += (a.balance * a.price);
        });

        // Update Total Balance Display
        const balEl = $('#totalBalance');
        if (balanceVisible) {
          balEl.textContent = formatMoney(totalPortfolioUsd);
          fitTotalBalanceFont();
        } else {
          balEl.textContent = '••••••';
          balEl.style.fontSize = '34px';
        }

        $('#availableBalanceText').textContent = '· Available: ' + formatMoney(totalPortfolioUsd);

        renderAssets();
        renderRateStrip();
        renderPercentageChange();
      }

      // ============================================================
      // 24H REAL PERCENTAGE CHANGE ENGINE
      // ============================================================
      async function renderPercentageChange() {
        const el = $('#balancePctChange');
        if (!el) return;

        let pct = null;
        try {
          const cached = JSON.parse(localStorage.getItem('bp_market_24h_change') || 'null');
          if (cached && isFinite(cached.pct) && (Date.now() - cached.ts < 10 * 60 * 1000)) {
            pct = cached.pct;
          } else {
            const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=usd&include_24hr_change=true');
            if (res.ok) {
              const data = await res.json();
              pct = data?.tether?.usd_24h_change;
              if (isFinite(pct)) {
                localStorage.setItem('bp_market_24h_change', JSON.stringify({ pct, ts: Date.now() }));
              }
            }
          }
        } catch (_) {}

        if (pct === null || !isFinite(pct)) {
          el.innerHTML = '<span style="color:var(--gray-400);">0.00%</span>';
          return;
        }

        const isUp = pct > 0.005;
        const isDown = pct < -0.005;
        const sign = isUp ? '+' : '';
        const color = isUp ? 'var(--green-500)' : (isDown ? 'var(--red-500)' : 'var(--gray-400)');
        const arrow = isUp ? '▲ ' : (isDown ? '▼ ' : '');

        el.innerHTML = `<span style="color:${color};">${arrow}${sign}${pct.toFixed(2)}%</span>`;
      }

      // ============================================================
      // RENDER ASSET LIST
      // ============================================================
      function fmtAmt(n, sym) {
        if (n === 0) return '0.00';
        if (sym === 'BTC' || sym === 'ETH') return Number(n).toFixed(6);
        return Number(n).toFixed(2);
      }

      function renderAssets() {
        $('#assetList').innerHTML = ASSETS.map(a => {
          const usdVal = a.balance * a.price;
          return `
            <div class="asset-row" data-asset="${a.symbol}">
              <div class="asset-row-icon"><img src="${a.icon}" alt="${a.symbol}"></div>
              <div class="asset-row-info">
                <div class="asset-row-name">${a.name}</div>
                <div class="asset-row-symbol">${a.symbol}</div>
                <div class="asset-live-price">1 ${a.symbol} ≈ ${formatMoney(a.price)}</div>
              </div>
              <div class="asset-row-balance">
                <div class="asset-row-amount">${fmtAmt(a.balance, a.symbol)} ${a.symbol}</div>
                <div class="asset-row-usd">≈ ${formatMoney(usdVal)}</div>
              </div>
              <button class="asset-row-dots" data-asset-menu="${a.symbol}" aria-label="Asset actions">⋮</button>
            </div>
          `;
        }).join('');

        $('#assetCount').textContent = ASSETS.length + ' assets';

        $$('.asset-row').forEach(row => {
          row.addEventListener('click', (e) => {
            if (e.target.closest('.asset-row-dots')) return;
            navigateTo('deposit.html');
          });
        });

        $$('.asset-row-dots').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openAssetActionSheet(btn.dataset.assetMenu);
          });
        });
      }

      // ============================================================
      // CURRENCY SELECTOR MODAL (BOTTOM-SHEET)
      // ============================================================
      const currencyModal = $('#currencyModal');
      const currencyOverlay = $('#currencyModalOverlay');
      const currencySearch = $('#currencySearchInput');

      function openCurrencyModal() {
        currencySearch.value = '';
        renderCurrencies();
        currencyOverlay.classList.add('open');
        currencyModal.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeCurrencyModal() {
        currencyOverlay.classList.remove('open');
        currencyModal.classList.remove('open');
        document.body.style.overflow = '';
      }

      function renderCurrencies(filter = '') {
        const q = filter.toLowerCase().trim();
        const active = getSelectedCurrency();
        const list = $('#currencyList');

        const filtered = CURRENCIES.filter(c => !q || c.code.toLowerCase().includes(q) || c.name.toLowerCase().includes(q));

        if (!filtered.length) {
          list.innerHTML = `<div style="text-align:center;padding:24px;font-size:13px;color:var(--gray-500);">No currencies found</div>`;
          return;
        }

        list.innerHTML = filtered.map(c => `
          <div class="currency-option ${c.code === active ? 'selected' : ''}" data-code="${c.code}">
            <div>
              <div class="curr-name">${c.name}</div>
              <div class="curr-code">${c.symbol} · ${c.code}</div>
            </div>
            <div style="font-size:13px;font-weight:800;color:var(--navy-900);">${c.code === active ? '✓' : ''}</div>
          </div>
        `).join('');

        list.querySelectorAll('.currency-option').forEach(item => {
          item.addEventListener('click', () => {
            setSelectedCurrency(item.dataset.code);
            closeCurrencyModal();
          });
        });
      }

      $('#currencyModalTrigger').addEventListener('click', openCurrencyModal);
      $('#currencyModalClose').addEventListener('click', closeCurrencyModal);
      currencyOverlay.addEventListener('click', closeCurrencyModal);
      currencySearch.addEventListener('input', (e) => renderCurrencies(e.target.value));

      // ============================================================
      // EYE TOGGLE
      // ============================================================
      $('#balanceEyeToggle').addEventListener('click', () => {
        balanceVisible = !balanceVisible;
        const icon = $('#balanceEyeIcon');
        if (balanceVisible) {
          icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        } else {
          icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        }
        refreshAllBalances();
      });

      // ============================================================
      // RATE STRIP
      // ============================================================
      function renderRateStrip() {
        const rateEl = $('#walletRateValue');
        if (rateEl) {
          rateEl.textContent = `1 USDT ≈ ${formatMoney(1.00)}`;
        }
      }

      $('#walletRateRefresh').addEventListener('click', () => {
        const btn = $('#walletRateRefresh');
        btn.classList.add('spinning');
        setTimeout(() => {
          btn.classList.remove('spinning');
          refreshAllBalances();
          showToast('Market rates updated');
        }, 600);
      });

      // ============================================================
      // RECENT ACTIVITY ENGINE (CONNECTED TO REAL TRANSACTIONS)
      // ============================================================
      function readStorageJSON(key) {
        try {
          const v = JSON.parse(localStorage.getItem(key) || '[]');
          return Array.isArray(v) ? v : [];
        } catch (_) { return []; }
      }

      function loadRecentTransactions() {
        const list = [];

        // 1. Unified transactions ledger (from deposit & withdraw)
        readStorageJSON('bp_transactions').forEach((t, i) => {
          list.push({
            id: t.id || ('tx-' + i),
            type: (t.type || 'deposit').toLowerCase(),
            title: (t.type === 'Withdrawal' ? 'Withdrawal' : 'Deposit') + ' · ' + (t.symbol || 'USDT'),
            date: t.date || 'Recent',
            amount: parseFloat(t.amount || 0).toFixed(2),
            symbol: t.symbol || 'USDT',
            status: (t.status || 'completed').toLowerCase(),
            raw: t
          });
        });

        // 2. Direct deposits
        readStorageJSON('bp_deposits').forEach((d, i) => {
          list.push({
            id: 'dep-' + i,
            type: 'deposit',
            title: 'Deposit · ' + (d.symbol || 'USDT'),
            date: d.date || 'Recent',
            amount: parseFloat(d.amount || 0).toFixed(2),
            symbol: d.symbol || 'USDT',
            status: (d.status || 'completed').toLowerCase(),
            raw: d
          });
        });

        // 3. Direct withdrawals
        readStorageJSON('bp_withdrawals').forEach((w, i) => {
          list.push({
            id: 'wd-' + i,
            type: 'withdraw',
            title: 'Withdrawal · ' + (w.asset || w.symbol || 'USDT'),
            date: w.date || 'Recent',
            amount: parseFloat(w.amount || 0).toFixed(2),
            symbol: w.asset || w.symbol || 'USDT',
            status: (w.status || 'pending').toLowerCase(),
            raw: w
          });
        });

        // 4. P2P Trades
        readStorageJSON('bp_p2p_orders').forEach((p, i) => {
          list.push({
            id: 'p2p-' + i,
            type: 'trade',
            title: 'P2P Trade · ' + (p.crypto || 'USDT'),
            date: p.date || 'Recent',
            amount: parseFloat(p.cryptoAmount || p.amount || 0).toFixed(2),
            symbol: p.crypto || 'USDT',
            status: (p.status || 'completed').toLowerCase(),
            raw: p
          });
        });

        // De-duplicate by ID
        const seen = new Set();
        const unique = [];
        list.forEach(item => {
          if (!seen.has(item.id)) {
            seen.add(item.id);
            unique.push(item);
          }
        });

        TX.length = 0;
        unique.forEach(u => TX.push(u));
        renderTx();
      }

      function renderTx() {
        const filtered = currentTxFilter === 'all'
          ? TX
          : TX.filter(t => t.type === currentTxFilter);

        if (!filtered.length) {
          $('#txList').innerHTML = `<div class="empty-tx">No transactions found.</div>`;
          return;
        }

        $('#txList').innerHTML = filtered.map(t => {
          const isPos = t.type === 'deposit' || t.type === 'trade';
          const sign = isPos ? '+' : '-';
          const cls = isPos ? 'positive' : 'negative';
          const icon = t.type === 'deposit' ? '↓' : (t.type === 'withdraw' ? '↑' : '⇄');
          return `
            <div class="tx-item" data-txid="${t.id}">
              <div class="tx-icon ${t.type}">${icon}</div>
              <div class="tx-info">
                <div class="tx-title">${t.title}</div>
                <div class="tx-date">${t.date}</div>
                <span class="activity-type-pill ${t.type}">${t.type}</span>
              </div>
              <div class="tx-amount">
                <div class="tx-amount-val ${cls}">${sign}${t.amount} ${t.symbol}</div>
                <div class="tx-status ${t.status === 'completed' ? '' : 'pending'}">${t.status}</div>
              </div>
              <div class="tx-item-arrow">›</div>
            </div>
          `;
        }).join('');

        $$('.tx-item').forEach(el => {
          el.addEventListener('click', () => {
            const tx = TX.find(x => x.id === el.dataset.txid);
            if (tx) openTxDetail(tx);
          });
        });
      }

      $$('.tx-filter').forEach(btn => {
        btn.addEventListener('click', () => {
          $$('.tx-filter').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTxFilter = btn.dataset.txfilter;
          renderTx();
        });
      });

      // ============================================================
      // ASSET ACTION MODAL
      // ============================================================
      let activeActionSymbol = 'USDT';
      const actionSheet = $('#assetActionSheet');
      const sheetOverlay = $('#sheetOverlay');

      function openAssetActionSheet(sym) {
        activeActionSymbol = sym;
        const a = ASSETS.find(x => x.symbol === sym);
        $('#assetActionTitle').textContent = (a ? a.name : sym) + ' (' + sym + ')';
        $('#assetActionDepositSub').textContent = `Deposit ${sym} to your wallet`;
        $('#assetActionWithdrawSub').textContent = `Withdraw ${sym} to an external address`;
        sheetOverlay.classList.add('open');
        actionSheet.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeAssetActionSheet() {
        sheetOverlay.classList.remove('open');
        actionSheet.classList.remove('open');
        document.body.style.overflow = '';
      }

      $('#assetActionClose').addEventListener('click', closeAssetActionSheet);
      $('#assetActionDeposit').addEventListener('click', () => {
        closeAssetActionSheet();
        navigateTo('deposit.html');
      });
      $('#assetActionWithdraw').addEventListener('click', () => {
        closeAssetActionSheet();
        navigateTo('withdraw.html');
      });

      // ============================================================
      // TX DETAIL MODAL
      // ============================================================
      const txSheet = $('#txDetailSheet');

      function openTxDetail(tx) {
        const body = $('#txDetailBody');
        const raw = tx.raw || {};
        $('#txDetailTitle').textContent = tx.title;

        body.innerHTML = `
          <div class="tx-detail-row"><span class="k">Reference ID</span><span class="v">${tx.id}</span></div>
          <div class="tx-detail-row"><span class="k">Transaction Type</span><span class="v">${tx.type.toUpperCase()}</span></div>
          <div class="tx-detail-row"><span class="k">Amount</span><span class="v">${tx.amount} ${tx.symbol}</span></div>
          ${raw.network ? `<div class="tx-detail-row"><span class="k">Network</span><span class="v">${raw.network}</span></div>` : ''}
          ${raw.address ? `<div class="tx-detail-row"><span class="k">Destination</span><span class="v">${raw.address}</span></div>` : ''}
          <div class="tx-detail-row"><span class="k">Timestamp</span><span class="v">${tx.date}</span></div>
          <div class="tx-detail-row"><span class="k">Status</span><span class="v"><span class="tx-status-pill ${tx.status === 'completed' ? 'completed' : 'pending'}">${tx.status.toUpperCase()}</span></span></div>
        `;

        sheetOverlay.classList.add('open');
        txSheet.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeTxDetail() {
        sheetOverlay.classList.remove('open');
        txSheet.classList.remove('open');
        document.body.style.overflow = '';
      }

      $('#txDetailClose').addEventListener('click', closeTxDetail);
      sheetOverlay.addEventListener('click', () => {
        closeAssetActionSheet();
        closeTxDetail();
      });

      // ============================================================
      // PRIMARY BUTTONS & NAVIGATION
      // ============================================================
      $('#depositBtn').addEventListener('click', () => navigateTo('deposit.html'));
      $('#withdrawBtn').addEventListener('click', () => navigateTo('withdraw.html'));
      $('#backBtn').addEventListener('click', () => navigateTo('index.html'));
      $('#historyBtn').addEventListener('click', () => {
        document.querySelector('.tx-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      $$('.bottom-nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const nav = btn.dataset.nav;
          if (nav === 'wallet') return;
          if (nav === 'home') navigateTo('index.html');
          if (nav === 'p2p') navigateTo('p2p.html');
          if (nav === 'trade') navigateTo('trade.html');
          if (nav === 'swap') navigateTo('swap.html');
        });
      });

      // Synchronize across open tabs or returning pages
      window.addEventListener('storage', (e) => {
        if (!e.key) return;
        if (['bp_user_balance', 'user_balance', 'bp_wallet_balance', 'bp_transactions', 'bp_withdrawals'].includes(e.key)) {
          refreshAllBalances();
          loadRecentTransactions();
        }
      });

      window.addEventListener('focus', () => {
        refreshAllBalances();
        loadRecentTransactions();
      });

      // ============================================================
      // INITIALIZATION
      // ============================================================
      $('#totalBalCurrencyLabel').textContent = getSelectedCurrency();
      refreshAllBalances();
      loadRecentTransactions();

    })();
  </script>
</body>
</html>
